# Defaults for one model. Anything on the command line overrides these.
#
#   python scripts/evaluate.py --task moleculenet \
#       --config configs/evaluation/open_source/vllm_example.yaml
#
# The server URL is not here: it comes from HOSTED_VLLM_API_BASE, so the same
# config works wherever the server happens to be running.

model: hosted_vllm/Qwen/Qwen3-8B

# Generation
thinking: false
thinking_effort: medium      # low | medium | high | max (high and max are Qwen3.8's xhigh)
max_output_tokens: 1024      # raise to ~16384 for thinking runs
workers: 64                  # concurrent requests; vLLM batches them server-side

# MoleculeNet
shots: "0,5,20"
seeds: "0,1,2"
split: test
limit: null                  # null evaluates the whole test split
# datasets: "bbbp,hiv,delaney"

# Retrosynthesis
mode: raw                    # raw | pipeline | autosolve
prompt: deepretro            # deepretro | ether0
data: uspto_50k_test_250
# stability_check and hallucination_check are left unset on purpose: they default to
# off in raw/pipeline and to ON in autosolve, which is DeepRetro's AutoSolver default.
# Setting either here overrides that for every mode. In autosolve the hallucination
# check ranks pathways instead of dropping them.
# stability_check: false
# hallucination_check: false

# autosolve mode only: AiZynthFinder first, the LLM as fallback. Needs `pip install .[az]`,
# and AZ_MODELS_PATH (holding <az_model>/config.yml) or AZ_MODEL_CONFIG_PATH set to absolute paths.
az_model: Pistachio_100+     # DeepRetro's default
top_k: 3                     # LLM pathways kept per molecule, as DeepRetro's batch runner
az_workers: 4                # each worker loads its own AZ model and stock
# az_cache: null             # default: <out-root>/az_cache/<data>_<az_model>.jsonl, shared across LLM runs

# ChemLLMBench (uses `shots` and `limit` above too; shots default to 0 when unset)
# subtasks: all              # task keys or groups, e.g. "property_prediction,smiles_to_iupac"
# strategy: random           # random | scaffold

# Observability
perf: false                  # scrape the server's /metrics during generation
# wandb_project: chemberta4-eval
# hf_repo: Harindhar10/chemberta4-evals  # public dataset repo; needs $HF_TOKEN
tag: null                    # free-form note about the serving setup, e.g. "H100x2 tp2"
