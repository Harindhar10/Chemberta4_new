[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chemberta4"
version = "0.1.0"
description = "Evaluation of open-source LLMs on MoleculeNet and single-step retrosynthesis, served by vLLM"
requires-python = ">=3.11"
dependencies = [
    "pandas",
    "numpy",
    "rdkit",
    "litellm",
    "structlog",
    "python-dotenv",
    "requests",
    "pyyaml",
]

[project.optional-dependencies]
# Scoring only: deepchem supplies roc_auc_score / rms_score for MoleculeNet.
score = ["deepchem"]
wandb = ["wandb"]
hub = ["huggingface_hub>=0.34"]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Doctests are collected by tests/test_doctests.py rather than
# --doctest-modules, which would import every module at collection time and
# fail wherever an optional dependency (deepchem, litellm) is absent.
